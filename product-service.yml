spring:
  application:
    name: product-service

  config:
    import: "configserver:http://localhost:9095"



  datasource:
    url: jdbc:mysql://localhost:3306/ecommerce_product_db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8081

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    info:
      access: unrestricted
