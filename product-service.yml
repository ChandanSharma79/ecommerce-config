spring:
  application:
    name: product-service

  datasource:
    url: jdbc:mysql://host.docker.internal:3306/ecommerce_product_db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  rabbitmq:
    host: rabbitmq
    port: 5672
    username: guest
    password: guest

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8081

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    info:
      access: unrestricted

app:
  message: "Refresh test Successfully"
