spring:
  application:
    name: product-service



  datasource:
    url: jdbc:mysql://localhost:3306/ecommerce_product_db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8081


  endpoint:
    info:
      access: unrestricted
app:
  message: "Hello from Config Server"
